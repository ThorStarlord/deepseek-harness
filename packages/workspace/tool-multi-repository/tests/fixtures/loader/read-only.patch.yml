# Production headless profile plus the Workspace and Agent preset rows used by Web.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: agent-loop
  config:
    agents: []

- id: sandbox-policy
  inject: []
  config:
    mode: read-only
    workspaceRoot: !!js process.cwd()

- insert:
    - id: workspace
      name: '@deepseek-ai/dsh-workspace'

    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: standard

    - id: preset-standard
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: standard
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a coding agent powered by the {{model}} model.

    - id: tool-multi-repository
      name: '@deepseek-ai/dsh-tool-multi-repository'
